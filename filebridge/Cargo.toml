[package]
name = "filebridge"
version.workspace = true
edition.workspace = true
description = "High-level client library for the filebridge API"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
# The TLS backend is chosen by the features below. Turning the defaults off
# also turns off http2, charset and macos-system-configuration, so they are
# listed again.
reqwest = { version = "0.12", default-features = false, features = [
    "json", "stream", "http2", "charset", "macos-system-configuration",
] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "io-util"] }
sha2.workspace = true
hex.workspace = true
base64.workspace = true
url = "2.5"
thiserror = "2.0"
bytes.workspace = true
async-stream = "0.3.6"
rand = { version = "0.10.0", features = ["std"] }
chacha20poly1305.workspace = true
hmac.workspace = true
zstd = "0.13"
hkdf = "0.12"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["native-tls"]
# TLS through the platform's library (OpenSSL on Linux), trusting the system's
# certificate store.
native-tls = ["reqwest/native-tls"]
# TLS through rustls, also trusting the system's certificate store, without
# OpenSSL. For static builds.
rustls = ["reqwest/rustls-tls-native-roots"]
