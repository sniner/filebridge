name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p&&/^[[:space:]]*version[[:space:]]*=/{gsub(/^[[:space:]]*version[[:space:]]*=[[:space:]]*"/,"");gsub(/".*$/,"");print;exit}' Cargo.toml)
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag != Cargo.toml version $pkg"; exit 1; }

  lint-and-test:
    # Releases are cut by tag push, which does not wait for ci.yml on main —
    # this job is the gate that keeps a tag from releasing over red tests.
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: pytest
        working-directory: filebridge-py
        run: |
          uv sync --locked
          uv run pytest

  build-rust-binaries:
    name: Build binaries on ${{ matrix.os }}
    needs: [verify-version, lint-and-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: ""
            asset_suffix: "-linux-amd64"
          - os: windows-latest
            artifact_suffix: ".exe"
            asset_suffix: "-windows-amd64.exe"
          - os: macos-latest
            artifact_suffix: ""
            asset_suffix: "-macos-universal"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS cross-compile target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Build binaries
        if: runner.os != 'macOS'
        run: cargo build --release -p filebridge-cli -p filebridged -p filebridge-mcp

      - name: Build universal macOS binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --release -p filebridge-cli -p filebridged -p filebridge-mcp --target aarch64-apple-darwin
          cargo build --release -p filebridge-cli -p filebridged -p filebridge-mcp --target x86_64-apple-darwin
          lipo -create -output target/release/filebridge-cli \
            target/aarch64-apple-darwin/release/filebridge-cli \
            target/x86_64-apple-darwin/release/filebridge-cli
          lipo -create -output target/release/filebridged \
            target/aarch64-apple-darwin/release/filebridged \
            target/x86_64-apple-darwin/release/filebridged
          lipo -create -output target/release/filebridge-mcp \
            target/aarch64-apple-darwin/release/filebridge-mcp \
            target/x86_64-apple-darwin/release/filebridge-mcp

      - name: Rename binaries for upload
        shell: bash
        run: |
          mv target/release/filebridge-cli${{ matrix.artifact_suffix }} target/release/filebridge-cli${{ matrix.asset_suffix }}
          mv target/release/filebridged${{ matrix.artifact_suffix }} target/release/filebridged${{ matrix.asset_suffix }}
          mv target/release/filebridge-mcp${{ matrix.artifact_suffix }} target/release/filebridge-mcp${{ matrix.asset_suffix }}

      - name: Upload filebridge-cli
        uses: actions/upload-artifact@v4
        with:
          name: filebridge-cli${{ matrix.asset_suffix }}
          path: target/release/filebridge-cli${{ matrix.asset_suffix }}

      - name: Upload filebridged
        uses: actions/upload-artifact@v4
        with:
          name: filebridged${{ matrix.asset_suffix }}
          path: target/release/filebridged${{ matrix.asset_suffix }}

      - name: Upload filebridge-mcp
        uses: actions/upload-artifact@v4
        with:
          name: filebridge-mcp${{ matrix.asset_suffix }}
          path: target/release/filebridge-mcp${{ matrix.asset_suffix }}

  build-rust-lib:
    name: Package Rust Library
    needs: [verify-version, lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Package filebridge crate
        run: cargo package -p filebridge --no-verify

      - name: Upload crate artifact
        uses: actions/upload-artifact@v4
        with:
          name: filebridge-crate
          path: target/package/*.crate

  build-python:
    name: Build Python Package
    needs: [verify-version, lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Build wheel and sdist
        working-directory: filebridge-py
        run: uv build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: filebridge-py/dist/*

  release:
    name: Create Release
    needs: [build-rust-binaries, build-rust-lib, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { grab=1; next }
              grab && /^## \[/          { exit }
              grab                      { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          [ -s release-notes.md ] || { echo "::error::No CHANGELOG section for [$version]"; exit 1; }

      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md
